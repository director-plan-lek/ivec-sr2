[package]
name = "alux"
version = "0.1.0"
description = "Alux — a lightweight cross-platform browser with installable Alux Apps"
authors = ["Alux"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "alux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
