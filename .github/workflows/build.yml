name: build-ivec-sr2

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Drop local-only npm cache config
        run: Remove-Item .npmrc -ErrorAction SilentlyContinue
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ivec-sr2-windows
          path: |
            src-tauri/target/release/alux.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2
      - run: rm -f .npmrc
      - run: npm ci
      - run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: ivec-sr2-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: rm -f .npmrc
      - run: npm ci
      - name: Init Android project
        run: npx tauri android init --ci
      - name: Apply IVEC Android patches
        run: |
          set +e
          SRC=src-tauri/gen/android/app/src/main/java/com/alux/browser
          echo "--- generated tree (./src-tauri/gen/android) ---"
          TREE=$(find src-tauri/gen/android -maxdepth 8 -type d 2>/dev/null | head -30)
          echo "$TREE"
          # Annotations are readable from the API without a token, so mirror the
          # layout there when the expected package folder is missing.
          if [ ! -d "$SRC" ]; then
            echo "$TREE" | while IFS= read -r line; do [ -n "$line" ] && echo "::error::tree: $line"; done
            exit 1
          fi
          cp -v scripts/android/RustWebViewClient.kt  "$SRC/generated/RustWebViewClient.kt" || echo "::error::cp failed: RustWebViewClient.kt"
          cp -v scripts/android/RustWebView.kt        "$SRC/generated/RustWebView.kt"       || echo "::error::cp failed: RustWebView.kt"
          cp -v scripts/android/MainActivity.kt       "$SRC/MainActivity.kt"                  || echo "::error::cp failed: MainActivity.kt"
      - name: Build APK (debug)
        run: npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ivec-sr2-android
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------------- iOS
  #
  # macOS runner (free minutes on public repos). Two outcomes:
  #
  #   * unsigned build  -> IVEC-SR2-device.app  (sideload: Xcode / Apple Configurator / Sideloadly
  #                        re-signs it with the user's own Apple ID; no $99 account needed,
  #                        the app then expires after 7 days)
  #   * signed build    -> IVEC-SR2.ipa         (only when the 5 APPLE_* secrets below exist;
  #                        installable via TestFlight / Ad Hoc / Xcode)
  #
  # Secrets for the signed path:
  #   APPLE_CERTIFICATE            base64 of the .p12 distribution certificate
  #   APPLE_CERTIFICATE_PASSWORD   password of that .p12
  #   APPLE_SIGNING_IDENTITY       e.g. "Apple Distribution: Your Org (TEAMID)"
  #   APPLE_DEVELOPMENT_TEAM       10-character Team ID
  #   APPLE_MOBILE_PROVISION       base64 of the .mobileprovision (Ad Hoc / Development)
  ios:
    runs-on: macos-latest
    continue-on-error: true
    # Job-level so the `if:` conditions on the signing steps can read them.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: rm -f .npmrc
      - run: npm ci

      - name: XcodeGen (project generator used by `tauri ios init`)
        run: brew install xcodegen

      - name: Init iOS project
        run: |
          set +e
          npx tauri ios init --ci > ios-init.log 2>&1
          status=$?
          echo "--- init exit=$status ---"
          tail -n 30 ios-init.log
          if [ $status -ne 0 ]; then
            tail -n 30 ios-init.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi
          xcodegen --version || true

      - name: Allow plain-HTTP LAN pages (optional)
        run: |
          PLIST=$(find src-tauri/gen/apple -name Info.plist -not -path "*/Pods/*" | head -n 1)
          echo "patching $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true

      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p actions $KEYCHAIN
          security set-keychain-settings -t 3600 -u $KEYCHAIN
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k $KEYCHAIN \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions $KEYCHAIN

      - name: Install provisioning profile
        if: ${{ env.APPLE_MOBILE_PROVISION != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_MOBILE_PROVISION" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build for device (arm64)
        run: npx tauri ios build --target aarch64-apple-ios

      - name: Collect artifacts
        run: |
          mkdir -p out
          # .app is a directory bundle; .ipa only exists when the build was signed
          find src-tauri/gen/apple/build -name "*.app" -exec cp -R {} out/ \; || true
          find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} out/ \; || true
          ls -lah out

      - uses: actions/upload-artifact@v4
        with:
          name: ivec-sr2-ios
          path: out/
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### IVEC SR 2 — iOS build"
            echo ""
            ls -1 out || true
            echo ""
            if ls out/*.ipa >/dev/null 2>&1; then
              echo "ได้ไฟล์ **.ipa** (เซ็นแล้ว) — ติดตั้งผ่าน TestFlight / Ad Hoc / Xcode"
            else
              echo "ได้ไฟล์ **.app** (ยังไม่เซ็น) — ใช้ Xcode, Apple Configurator หรือ Sideloadly เซ็นด้วย Apple ID ของคุณ"
              echo ""
              echo "แอปจาก Apple ID ฟรีจะหมดอายุใน 7 วัน"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
